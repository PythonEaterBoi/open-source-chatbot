<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Source Chatbot</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --accent-dark: #16a34a;
      --user: #2563eb;
      --assistant: #374151;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(135deg, #020817, #0f172a 40%, #111827);
      color: var(--text);
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-shell {
      width: min(900px, 92vw);
      height: min(85vh, 760px);
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .status {
      color: var(--accent);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(2, 6, 23, 0.2);
    }

    .message {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      background: var(--user);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: var(--assistant);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .composer {
      display: flex;
      gap: 12px;
      padding: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
    }

    input {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 16px 18px;
      background: #0b1220;
      color: white;
      font-size: 1rem;
      outline: none;
      border: 1px solid rgba(255,255,255,0.08);
    }

    button {
      padding: 0 22px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #03120a;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="chat-shell">
    <div class="topbar">
      <div>Open Source Chatbot</div>
      <div class="status">Local LLM</div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <input id="prompt" type="text" placeholder="Ask anything..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const promptInput = document.getElementById("prompt");
    const sendBtn = document.getElementById("sendBtn");

    let history = [];

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const message = promptInput.value.trim();
      if (!message) return;

      addMessage("user", message);
      promptInput.value = "";
      sendBtn.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            history
          })
        });

        const data = await res.json();
        const reply = data.reply || "No reply received.";

        addMessage("assistant", reply);

        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: reply });

      } catch (error) {
        addMessage("assistant", "Something went wrong while contacting the chatbot backend.");
        console.error(error);
      } finally {
        sendBtn.disabled = false;
        promptInput.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);

    promptInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    addMessage("assistant", "Hello! I’m your open-source chatbot. Ask me anything.");
  </script>
</body>
</html>
